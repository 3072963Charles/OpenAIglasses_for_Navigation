<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="BrightEyes Networking Intelligence Layer - ESP32-S3 x Cloud AI">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#04211f"/>
      <stop offset="0.55" stop-color="#084b45"/>
      <stop offset="1" stop-color="#0ea296"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.15" cy="0.18" r="0.5">
      <stop offset="0" stop-color="#5eead4" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#5eead4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#ffffff" opacity="0.13"/>
    </pattern>
  </defs>
  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#glow)"/>
  <rect width="1280" height="320" fill="url(#dots)"/>
  <g font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif">
    <text x="72" y="106" font-size="46" font-weight="700" fill="#ffffff">明眸 BrightEyes · <tspan fill="#5eead4">联网智能层</tspan></text>
    <text x="74" y="148" font-size="22" fill="#ccfbf1" opacity="0.92">ESP32-S3 双模互联 × 云端 AI 视觉增强</text>
    <text x="74" y="194" font-size="25" font-weight="600" fill="#ffffff">盲道导航 / 红绿灯识别 / 斑马线居中 / 物品查找 / 场景认知</text>
    <g font-size="18" font-weight="600">
      <rect x="72" y="228" width="238" height="40" rx="20" fill="#ffffff" opacity="0.12" stroke="#ffffff" stroke-opacity="0.25"/>
      <text x="191" y="253" text-anchor="middle" fill="#5eead4">WiFi 6 + BT 5.0</text>
      <rect x="326" y="228" width="238" height="40" rx="20" fill="#ffffff" opacity="0.12" stroke="#ffffff" stroke-opacity="0.25"/>
      <text x="445" y="253" text-anchor="middle" fill="#a7f3d0">FastAPI + 大模型</text>
      <rect x="580" y="228" width="238" height="40" rx="20" fill="#ffffff" opacity="0.12" stroke="#ffffff" stroke-opacity="0.25"/>
      <text x="699" y="253" text-anchor="middle" fill="#99f6e4">YOLO 视觉识别</text>
      <rect x="834" y="228" width="238" height="40" rx="20" fill="#ffffff" opacity="0.12" stroke="#ffffff" stroke-opacity="0.25"/>
      <text x="953" y="253" text-anchor="middle" fill="#c4b5fd">与 STM32 双核协同</text>
    </g>
  </g>
</svg>