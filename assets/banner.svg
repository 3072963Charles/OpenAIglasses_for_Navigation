<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="BrightEyes AI Navigation Glasses for the Visually Impaired">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#04211f"/>
      <stop offset="0.55" stop-color="#084b45"/>
      <stop offset="1" stop-color="#0ea296"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.15" cy="0.18" r="0.5">
      <stop offset="0" stop-color="#5eead4" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#5eead4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#ffffff" opacity="0.13"/>
    </pattern>
  </defs>
  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#glow)"/>
  <rect width="1280" height="320" fill="url(#dots)"/>
  <g font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif">
    <text x="72" y="110" font-size="52" font-weight="700" fill="#ffffff">明眸 <tspan fill="#5eead4">BrightEyes</tspan> · AI 智能导盲眼镜系统</text>
    <text x="74" y="152" font-size="22" fill="#ccfbf1" opacity="0.92">AI Navigation &amp; Assistance System for the Visually Impaired</text>
    <text x="74" y="196" font-size="25" font-weight="600" fill="#ffffff">软硬件一体化 · 盲道导航 / 过马路辅助 / 物品查找 / 实时语音交互</text>
    <g font-size="18" font-weight="600">
      <rect x="72" y="230" width="208" height="40" rx="20" fill="#ffffff" opacity="0.12" stroke="#ffffff" stroke-opacity="0.25"/>
      <text x="176" y="255" text-anchor="middle" fill="#5eead4">YOLO 盲道分割</text>
      <rect x="296" y="230" width="206" height="40" rx="20" fill="#ffffff" opacity="0.12" stroke="#ffffff" stroke-opacity="0.25"/>
      <text x="399" y="255" text-anchor="middle" fill="#a7f3d0">Qwen-Omni 语音</text>
      <rect x="518" y="230" width="206" height="40" rx="20" fill="#ffffff" opacity="0.12" stroke="#ffffff" stroke-opacity="0.25"/>
      <text x="621" y="255" text-anchor="middle" fill="#99f6e4">FastAPI 后端</text>
      <rect x="740" y="230" width="212" height="40" rx="20" fill="#ffffff" opacity="0.12" stroke="#ffffff" stroke-opacity="0.25"/>
      <text x="846" y="255" text-anchor="middle" fill="#c4b5fd">STM32 硬件端</text>
      <rect x="968" y="230" width="240" height="40" rx="20" fill="#ffffff" opacity="0.12" stroke="#ffffff" stroke-opacity="0.25"/>
      <text x="1088" y="255" text-anchor="middle" fill="#fca5a5">竞赛省二等奖</text>
    </g>
  </g>
</svg>
